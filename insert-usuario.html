<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insertar Usuario</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="insertar-body">
    <div class="Titulo_insertar">
        <h1>Insertar Usuario</h1>
    </div>
    <div class="Formulario_insertar">
        <form action="" method="POST">
            <label for="nombre_usu">Nombre usuario:</label>
            <input type="text" id="nombre_usu" name="nombre" autocomplete="given-name" required>

            <label for="nfc_usu">NFC:</label>
            <input type="text" id="nfc_usu" name="nfc" autocomplete="family-name" required>

            <button type="submit" id="btnInsertar">Insertar Usuario</button>
        </form>
    </div>
</body>
</html>
