    <div class="formulario">
        <h2>Agregar Componente</h2>
        <form id="for-Inventario" onsubmit="agregarFila(event)">
            <label for="componente">Componente:</label>
            <input type="text" id="componente" name="componente" required>

            <label for="descripcion">Descripción:</label>
            <input type="text" id="descripcion" name="descripcion" required>

            <label for="cantidad">Cantidad:</label>
            <input type="number" id="cantidad" name="cantidad" required>

            <label for="ubicacion">Ubicación:</label>
            <input type="text" id="ubicacion" name="ubicacion" required>

            <label for="precio">Precio:</label>
            <input type="number" step="0.01" id="precio" name="precio" required>

            <button type="submit">Agregar</button>
            <p id="errorMsg" class="error"></p>
        </form>
    </div>

			aria-labelledby="modal-nfc-titulo" onclick="event.stopPropagation()">

<script src="/js/script.js"></script>
<script>
	function verificarEmpleado() {
		const empleado = sessionStorage.getItem("empleado");

		if (!empleado) {
			window.location.href = "/login.html";
		} else {
			fillTable();
		}
	}

	document.addEventListener("DOMContentLoaded", () => {
		verificarEmpleado();

		cargarPeticiones();
		setInterval(cargarPeticiones, 5000);

		consultarEventosNfc();
		setInterval(consultarEventosNfc, 2000);
	});
</script>
