server {
    listen 80;
    server_name _;

    root /app;
    index index.html;

    location /api/ {
        proxy_pass http://python:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /empleado {
        proxy_pass http://python:5000;
    }

    location = /inventario {
        proxy_pass http://python:5000;
    }

    location = /inventario_nombre {
        proxy_pass http://python:5000;
    }

    location = /surtir {
        proxy_pass http://python:5000;
    }

    location = /surtir_componentes {
        proxy_pass http://python:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /pedir {
        try_files /cliente.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
