<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
    <title>Insertar Componente</title>
</head>
<body class="insertar-comp-body">
    <div class="Titulo_insertar_componente">
        <h1>Insertar Componente</h1>
    </div>
    <div class="Formulario_insertar_componente">
        <form action="" method="POST">
            <label for="nombre_comp">Nombre componente:</label>
            <input type="text" id="nombre_comp" name="nombre" required>

            <label for="descripcion_comp">Descripción:</label>
            <input type="text" id="descripcion_comp" name="descripcion" required>

            <label for="cantidad_comp">Cantidad:</label>
            <input type="number" id="cantidad_comp" name="cantidad" required>

            <label for="ubicacion_comp">Ubicación:</label>
            <input type="text" id="ubicacion_comp" name="ubicacion" required>

            <label for="precio_comp">Precio:</label>
            <input type="number" step="0.01" id="precio_comp" name="precio" required>

            <button type="submit" id="btnInsertarComponente">Insertar Componente</button>
        </form>
    </div>
</body>
</html>
